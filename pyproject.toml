[project]
name = "ascend-torchtitan"
description = "Out-of-tree Ascend NPU extension for torchtitan: compat shims, fused-kernel overrides, parallel strategies and recipes."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "ascend-torchtitan maintainers" }]
keywords = ["pytorch", "torchtitan", "ascend", "npu", "llm", "training"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dynamic = ["version"]
# torchtitan itself is deliberately NOT listed here: it is pinned by commit SHA
# (see constraints/npu.txt and docs/upstream-tracking.md), which pyproject
# cannot express for a PyPI dependency. Install it with scripts/install.sh.
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "pre-commit", "ruff"]

[project.scripts]
ascend-titan-doctor = "ascend_titan.tools.doctor:main"
ascend-titan-provenance = "ascend_titan.tools.provenance:main"

[tool.setuptools.dynamic]
version = {attr = "ascend_titan.__version__"}

[tool.setuptools.packages.find]
where = [""]
include = ["ascend_titan*"]

[tool.setuptools.package-data]
# each model package ships its usage guide, and the template for new ones
ascend_titan = [
    "models/README.md",
    "models/*/README.md",
    "models/_template/*",
    "tools/matrix/triage.toml",  # attribution rules are data; the sweep reads them at runtime
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
addopts = ["--showlocals", "-ra"]
testpaths = ["tests"]
markers = [
    "npu: tests that require an Ascend NPU",
    "titan: tests that import torchtitan (need it installed at the pinned SHA)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"ascend_titan/tools/matrix.py" = ["E501"]
"tests/**" = ["E501"]
