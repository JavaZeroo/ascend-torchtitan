name: cpu
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        titan: [pinned, main]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      # NIGHTLY track (ADR-006): the same dated torch nightly the NPU gate uses.
      - run: pip install --pre "$(grep -E '^torch==' constraints/nightly.txt)" --index-url https://download.pytorch.org/whl/nightly/cpu
      - name: install torchtitan (${{ matrix.titan }})
        run: |
          git clone https://github.com/pytorch/torchtitan.git ../torchtitan
          if [ "${{ matrix.titan }}" = pinned ]; then
            git -C ../torchtitan checkout $(cat constraints/torchtitan.sha)
          fi
          pip install --no-deps -e ../torchtitan
          pip install -c constraints/nightly.txt -r <(grep -v '^torchvision' constraints/titan-deps.txt)
          pip install --no-deps --pre torchvision --index-url https://download.pytorch.org/whl/nightly/cpu
          pip install -e ".[dev]"
      - run: ruff check .
      - run: ascend-titan-doctor
      - run: pytest tests/unit -x
      # The `main` leg is allowed to fail: it is the drift probe, not a gate.
    continue-on-error: ${{ matrix.titan == 'main' }}
