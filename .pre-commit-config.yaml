repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: no-upstream-edits
        name: refuse edits under ../torchtitan
        entry: bash -c 'git diff --cached --name-only | grep -q "^\.\./torchtitan/" && { echo "do not edit torchtitan"; exit 1; } || exit 0'
        language: system
        pass_filenames: false
